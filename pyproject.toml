[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bambu-hando"
version = "0.1.0"
description = "Cross-platform filament profile handoff between BambuStudio and SpoolEase"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Max and Copilot" }
]
dependencies = [
  "requests>=2.32.0",
  "cryptography>=42.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[project.scripts]
bambu-hando = "bambu_hando.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
